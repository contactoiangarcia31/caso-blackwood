<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capítulo 2: El Búnker del Relojero</title>
  <style>
    :root {
      --bg-deep: #06090f;
      --bg-panel: #0e1420;
      --bg-card: #151e2e;
      --border: #26354d;
      --amber: #f59e0b;
      --cyan: #00f0ff;
      --crimson: #ff2a5f;
      --emerald: #10b981;
      --purple: #a855f7;
      --text: #e2e8f0;
      --muted: #8496b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(14, 20, 32, 0.9) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 20, 32, 0.9) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      overflow-x: hidden;
    }

    /* Efecto scanlines sutil */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      pointer-events: none;
      z-index: 999;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), 0 0 20px rgba(0, 240, 255, 0.05);
      overflow: hidden;
      position: relative;
    }

    header {
      background: #080c14;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-pill {
      font-family: monospace;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseGlow 1.4s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .content {
      padding: 20px;
    }

    h1 {
      font-size: 1.45rem;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    h2 {
      font-size: 1.18rem;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .progress-track {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .progress-node {
      flex: 1;
      height: 7px;
      border-radius: 4px;
      background: #1b263b;
      position: relative;
      overflow: hidden;
    }

    .progress-node.active::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--amber), var(--cyan));
      animation: shimmer 1.5s infinite linear;
    }

    .progress-node.done {
      background: var(--emerald);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    @media (max-width: 560px) {
      .role-grid { grid-template-columns: 1fr; }
    }

    .role-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .role-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 8px 24px rgba(0, 240, 255, 0.12);
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    .tab-btn.active {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }

    .interactive-stage {
      background: #070b12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .btn {
      background: linear-gradient(135deg, var(--cyan), #0088ff);
      color: #040811;
      font-weight: 700;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 0.12s, opacity 0.12s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    /* --- WIDGETS INTERACTIVOS --- */

    /* 1. Escáner UV (P1 Fase 1) */
    .uv-wall {
      width: 100%;
      height: 250px;
      background: #0c121e;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
      border: 1px solid #1e293b;
    }

    .uv-grid-lines {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .uv-hidden-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle 68px at var(--x, 50%) var(--y, 50%), rgba(168, 85, 247, 0.32), transparent 80%);
    }

    .uv-secret-item {
      position: absolute;
      font-family: monospace;
      font-weight: 700;
      color: #e9d5ff;
      text-shadow: 0 0 10px #a855f7, 0 0 20px #7e22ce;
      opacity: 0;
      transition: opacity 0.1s;
      pointer-events: none;
      text-align: center;
    }

    /* 2. Válvulas Giratorias (P1 Fase 1) */
    .valves-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 12px 0;
    }

    .valve-box {
      background: #0d1524;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .valve-wheel {
      width: 84px;
      height: 84px;
      margin: 8px auto;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 3. Matriz Láser 4x4 (P2 Fase 1) */
    .laser-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 14px auto;
    }

    .laser-node {
      aspect-ratio: 1;
      border-radius: 10px;
      background: #111a2b;
      border: 2px solid #263859;
      color: var(--text);
      font-family: monospace;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .laser-node.active {
      background: rgba(255, 42, 95, 0.22);
      border-color: var(--crimson);
      box-shadow: 0 0 14px rgba(255, 42, 95, 0.6);
      color: #fff;
    }

    /* 4. Cámara Térmica (P1 Fase 2) */
    .thermal-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 260px;
      margin: 12px auto;
      padding: 14px;
      background: #090614;
      border: 1px solid #3b1d5e;
      border-radius: 12px;
    }

    .thermal-key {
      height: 58px;
      border-radius: 8px;
      background: #130d26;
      border: 1px solid #2a1f4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      position: relative;
      overflow: hidden;
    }

    .heat-1 {
      background: radial-gradient(circle, #ffffff 5%, #ff2a00 45%, #61001d 90%);
      animation: heatPulse 1.1s infinite alternate;
    }
    .heat-2 {
      background: radial-gradient(circle, #ffe600 10%, #ff5e00 55%, #4a0e17 95%);
      animation: heatPulse 1.4s infinite alternate;
    }
    .heat-3 {
      background: radial-gradient(circle, #a3e635 5%, #059669 55%, #0f172a 95%);
