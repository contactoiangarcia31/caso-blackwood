<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capítulo 2: El Búnker del Relojero</title>
  <style>
    :root {
      --bg-deep: #06090f;
      --bg-panel: #0e1420;
      --bg-card: #151e2e;
      --border: #26354d;
      --amber: #f59e0b;
      --cyan: #00f0ff;
      --crimson: #ff2a5f;
      --emerald: #10b981;
      --purple: #a855f7;
      --text: #e2e8f0;
      --muted: #8496b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(14, 20, 32, 0.9) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 20, 32, 0.9) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      overflow-x: hidden;
    }

    /* Efecto scanlines sutil */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      pointer-events: none;
      z-index: 999;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), 0 0 20px rgba(0, 240, 255, 0.05);
      overflow: hidden;
      position: relative;
    }

    header {
      background: #080c14;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-pill {
      font-family: monospace;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseGlow 1.4s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .content {
      padding: 20px;
    }

    h1 {
      font-size: 1.45rem;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    h2 {
      font-size: 1.18rem;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .progress-track {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .progress-node {
      flex: 1;
      height: 7px;
      border-radius: 4px;
      background: #1b263b;
      position: relative;
      overflow: hidden;
    }

    .progress-node.active::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--amber), var(--cyan));
      animation: shimmer 1.5s infinite linear;
    }

    .progress-node.done {
      background: var(--emerald);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    @media (max-width: 560px) {
      .role-grid { grid-template-columns: 1fr; }
    }

    .role-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .role-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 8px 24px rgba(0, 240, 255, 0.12);
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    .tab-btn.active {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }

    .interactive-stage {
      background: #070b12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .btn {
      background: linear-gradient(135deg, var(--cyan), #0088ff);
      color: #040811;
      font-weight: 700;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 0.12s, opacity 0.12s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    /* --- WIDGETS INTERACTIVOS --- */

    /* 1. Escáner UV (P1 Fase 1) */
    .uv-wall {
      width: 100%;
      height: 250px;
      background: #0c121e;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
      border: 1px solid #1e293b;
    }

    .uv-grid-lines {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .uv-hidden-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle 68px at var(--x, 50%) var(--y, 50%), rgba(168, 85, 247, 0.32), transparent 80%);
    }

    .uv-secret-item {
      position: absolute;
      font-family: monospace;
      font-weight: 700;
      color: #e9d5ff;
      text-shadow: 0 0 10px #a855f7, 0 0 20px #7e22ce;
      opacity: 0;
      transition: opacity 0.1s;
      pointer-events: none;
      text-align: center;
    }

    /* 2. Válvulas Giratorias (P1 Fase 1) */
    .valves-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 12px 0;
    }

    .valve-box {
      background: #0d1524;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .valve-wheel {
      width: 84px;
      height: 84px;
      margin: 8px auto;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 3. Matriz Láser 4x4 (P2 Fase 1) */
    .laser-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 14px auto;
    }

    .laser-node {
      aspect-ratio: 1;
      border-radius: 10px;
      background: #111a2b;
      border: 2px solid #263859;
      color: var(--text);
      font-family: monospace;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .laser-node.active {
      background: rgba(255, 42, 95, 0.22);
      border-color: var(--crimson);
      box-shadow: 0 0 14px rgba(255, 42, 95, 0.6);
      color: #fff;
    }

    /* 4. Cámara Térmica (P1 Fase 2) */
    .thermal-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 260px;
      margin: 12px auto;
      padding: 14px;
      background: #090614;
      border: 1px solid #3b1d5e;
      border-radius: 12px;
    }

    .thermal-key {
      height: 58px;
      border-radius: 8px;
      background: #130d26;
      border: 1px solid #2a1f4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      position: relative;
      overflow: hidden;
    }

    .heat-1 {
      background: radial-gradient(circle, #ffffff 5%, #ff2a00 45%, #61001d 90%);
      animation: heatPulse 1.1s infinite alternate;
    }
    .heat-2 {
      background: radial-gradient(circle, #ffe600 10%, #ff5e00 55%, #4a0e17 95%);
      animation: heatPulse 1.4s infinite alternate;
    }
    .heat-3 {
      background: radial-gradient(circle, #a3e635 5%, #059669 55%, #0f172a 95%);
    }
    .heat-4 {
      background: radial-gradient(circle, #38bdf8 5%, #1d4ed8 50%, #0f172a 95%);
    }

    @keyframes heatPulse {
      0% { filter: brightness(0.95); }
      100% { filter: brightness(1.2); }
    }

    /* 5. Panel de Cables Animados (P1 Fase 3) */
    .wires-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 14px 0;
    }

    .wire-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b111d;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }

    .wire-row:hover {
      border-color: var(--amber);
    }

    .wire-cable {
      flex: 1;
      height: 14px;
      border-radius: 7px;
      position: relative;
      transition: all 0.2s;
    }

    .wire-cable.cut {
      opacity: 0.25;
      background: #334155 !important;
    }

    .wire-cable.cut::after {
      content: "✂ CORTADO";
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--crimson);
      background: #070b12;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--crimson);
    }

    .feedback-banner {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 22px;
      text-align: center;
    }

    .feedback-banner.err { color: var(--crimson); }
    .feedback-banner.ok { color: var(--emerald); }

    .hint-drawer {
      margin-top: 12px;
      padding: 12px;
      background: rgba(0, 240, 255, 0.07);
      border: 1px dashed rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #a5f3fc;
      display: none;
    }

    .slider-control {
      width: 100%;
      accent-color: var(--cyan);
      margin: 6px 0 12px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <div id="roleHeader" class="status-pill">
        <span class="pulse-dot"></span>
        <span>CAPÍTULO 2: BÚNKER 09</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="timerText" style="font-family:monospace; color:var(--muted); font-size:0.92rem;">00:00</span>
        <button class="btn-ghost" onclick="resetGame()">Reiniciar</button>
      </div>
    </header>

    <div id="appBody" class="content"></div>
  </div>

  <script>
    // --- MOTOR DE SONIDO SINTETIZADO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'valve') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(290, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'ok') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.09);
        osc.frequency.setValueAtTime(783.99, now + 0.18);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.38);
      } else if (type === 'err') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.setValueAtTime(110, now + 0.12);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // --- ESTADO GLOBAL ---
    let state = {
      role: null, // 'P1' o 'P2'
      stage: 0,   // 1, 2, 3, 4 (Victoria)
      tab: 0,
      hints: 0,
      startTime: null,
      timerId: null,
      animFrame: null,

      // Sub-estados de puzzles interactivos
      valves: [0, 0, 0, 0], // ángulos P1 Fase 1 (Meta: [180, 90, 270, 90])
      selectedSymbolP2: 'OMEGA',
      laserGrid: Array(16).fill(false), // Meta P2 Fase 1: índices [1, 6, 8, 15] -> A2, B3, C1, D4
      freqMHz: 96, // Meta P1 Fase 2: 108
      freqMod: 30, // Meta P1 Fase 2: 75
      freqWave: 'sine', // Meta P1 Fase 2: 'triangle'
      selectedSatP2: 0,
      thermalInputP2: [], // Meta P2 Fase 2: ['SOL', 'RAYO', 'OJO', 'LUNA']
      cutWiresP1: [], // Meta P1 Fase 3: [2, 5, 0] (Puertos III, VI, I)
      simSwitchesP2: [false, false, false] // Interruptores simulador P2 Fase 3
    };

    function startClock() {
      if (state.timerId) clearInterval(state.timerId);
      state.startTime = Date.now();
      state.timerId = setInterval(() => {
        const s = Math.floor((Date.now() - state.startTime) / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        document.getElementById('timerText').textContent = `${mm}:${ss}`;
      }, 1000);
    }

    function resetGame() {
      sfx('tap');
      if (state.timerId) clearInterval(state.timerId);
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      state = {
        role: null, stage: 0, tab: 0, hints: 0, startTime: null, timerId: null, animFrame: null,
        valves: [0, 0, 0, 0], selectedSymbolP2: 'OMEGA', laserGrid: Array(16).fill(false),
        freqMHz: 96, freqMod: 30, freqWave: 'sine', selectedSatP2: 0,
        thermalInputP2: [], cutWiresP1: [], simSwitchesP2: [false, false, false]
      };
      document.getElementById('timerText').textContent = '00:00';
      render();
    }

    function chooseRole(r) {
      sfx('ok');
      state.role = r;
      state.stage = 1;
      state.tab = 0;
      startClock();
      render();
    }

    function switchTab(t) {
      sfx('tap');
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      state.tab = t;
      render();
    }

    function toggleHint() {
      sfx('tap');
      const h = document.getElementById('hintBox');
      if (h) {
        if (h.style.display !== 'block') state.hints++;
        h.style.display = 'block';
      }
    }

    // =====================================================
    // RENDERIZADO PRINCIPAL
    // =====================================================
    function render() {
      if (state.animFrame) cancelAnimationFrame(state.animFrame);
      const root = document.getElementById('appBody');
      const headerPill = document.getElementById('roleHeader');

      if (!state.role) {
        headerPill.innerHTML = `<span class="pulse-dot"></span><span>CAPÍTULO 2: BÚNKER 09</span>`;
        root.innerHTML = `
          <h1>El Búnker del Relojero</h1>
          <p>Tras el arresto del Dr. Marcus Sterling, una alarma silenciosa activó la secuencia de autodestrucción en su laboratorio subterráneo secreto. Tienen que infiltrarse y desactivar el reactor de neurotoxina usando sus dos pantallas.</p>
          <div class="interactive-stage" style="border-left: 4px solid var(--cyan);">
            <h2 style="font-size:1.05rem;">Novedades del Capítulo 2</h2>
            <p style="margin-bottom:0;">Todos los acertijos ahora son <strong>gráficos e interactivos</strong>: usarán una linterna UV táctil, girarán válvulas hidráulicas, sintonizarán ondas en un osciloscopio en vivo y cortarán cables bajo presión.</p>
          </div>
          <div class="role-grid">
            <button class="role-card" onclick="chooseRole('P1')">
              <div style="font-size:2rem; margin-bottom:8px;">🔦</div>
              <strong style="font-size:1.08rem; color:var(--amber);">Jugador 1: Agente de Infiltración</strong>
              <p style="margin:6px 0 0; font-size:0.84rem;">Usa la linterna UV, gira las válvulas físicas, opera la cámara térmica y corta los cables del reactor.</p>
            </button>
            <button class="role-card" onclick="chooseRole('P2')">
              <div style="font-size:2rem; margin-bottom:8px;">🛰️</div>
              <strong style="font-size:1.08rem; color:var(--cyan);">Jugador 2: Especialista en Sistemas</strong>
              <p style="margin:6px 0 0; font-size:0.84rem;">Desactiva la matriz láser, opera el radar satelital, traduce firmas térmicas y simula el circuito de la bomba.</p>
            </button>
          </div>
        `;
        return;
      }

      headerPill.innerHTML = `<span class="pulse-dot"></span><span>${state.role === 'P1' ? 'AGENTE DE INFILTRACIÓN' : 'ESPECIALISTA EN SISTEMAS'}</span>`;

      if (state.stage === 4) {
        const finalTime = document.getElementById('timerText').textContent;
        root.innerHTML = `
          <div style="text-align:center; padding:18px 0;">
            <div style="font-size:3.4rem; margin-bottom:8px;">🛡️</div>
            <h1>¡Reactor Neutralizado a Tiempo!</h1>
            <p>Cortaron la energía del Búnker 09 antes de que la neurotoxina se liberara y descargaron el servidor maestro del <strong>Sindicato Espectro</strong>.</p>
            <div class="interactive-stage" style="text-align:left;">
              <h2>Reporte de Misión Cooperativa</h2>
              <p style="margin-bottom:4px;">• <strong>Tiempo oficial del equipo:</strong> <span style="color:var(--cyan); font-family:monospace;">${finalTime}</span></p>
              <p style="margin-bottom:4px;">• <strong>Pistas tácticas usadas:</strong> ${state.hints}</p>
              <p style="margin-bottom:0;">• <strong>Clasificación:</strong> ${state.hints === 0 ? 'Agentes Élite División Omega' : 'Operativos Especiales'}</p>
            </div>
            <button class="btn" onclick="resetGame()">Volver a Jugar / Intercambiar Roles</button>
          </div>
        `;
        return;
      }

      // Barra de progreso de 3 fases
      let prog = `<div class="progress-track">`;
      for (let i = 1; i <= 3; i++) {
        const cls = i < state.stage ? 'done' : (i === state.stage ? 'active' : '');
        prog += `<div class="progress-node ${cls}"></div>`;
      }
      prog += `</div>`;

      if (state.role === 'P1' && state.stage === 1) renderP1Stage1(root, prog);
      else if (state.role === 'P2' && state.stage === 1) renderP2Stage1(root, prog);
      else if (state.role === 'P1' && state.stage === 2) renderP1Stage2(root, prog);
      else if (state.role === 'P2' && state.stage === 2) renderP2Stage2(root, prog);
      else if (state.role === 'P1' && state.stage === 3) renderP1Stage3(root, prog);
      else if (state.role === 'P2' && state.stage === 3) renderP2Stage3(root, prog);
    }

    // =====================================================
    // FASE 1 — P1: LINTERNA UV + VÁLVULAS GIRATORIAS
    // =====================================================
    function renderP1Stage1(root, prog) {
      root.innerHTML = `
        ${prog}
        <h2>Fase 1: La Esclusa Hidráulica</h2>
        <p>Usa tu linterna UV para explorar el muro y tus válvulas para abrir la compuerta. También revisa la caja de fusibles para ayudar a tu pareja.</p>
        <div class="tab-bar">
          <button class="tab-btn ${state.tab === 0 ? 'active' : ''}" onclick="switchTab(0)">1. Linterna UV y Válvulas</button>
          <button class="tab-btn ${state.tab === 1 ? 'active' : ''}" onclick="switchTab(1)">2. Caja de Fusibles (Pista)</button>
        </div>
        <div id="stageContent"></div>
      `;

      const box = document.getElementById('stageContent');
      if (state.tab === 0) {
        const valveNames = ['Válvula NORTE (Roja)', 'Válvula ESTE (Azul)', 'Válvula SUR (Verde)', 'Válvula OESTE (Amarilla)'];
        const valveColors = ['#ff2a5f', '#00f0ff', '#10b981', '#f59e0b'];

        let valvesHtml = `<div class="valves-grid">`;
        for (let i = 0; i < 4; i++) {
          valvesHtml += `
            <div class="valve-box">

    function initUVLight() {
      const wall = document.getElementById('uvWall');
      const beam = document.getElementById('uvBeam');
      if (!wall || !beam) return;
      const items = wall.querySelectorAll('.uv-secret-item');

      function moveLight(clientX, clientY) {
        const rect = wall.getBoundingClientRect();
        const xPct = ((clientX - rect.left) / rect.width) * 100;
        const yPct = ((clientY - rect.top) / rect.height) * 100;
        beam.style.setProperty('--x', `${xPct}%`);
        beam.style.setProperty('--y', `${yPct}%`);

        items.forEach(el => {
          const ix = parseFloat(el.dataset.x);
          const iy = parseFloat(el.dataset.y);
          const dist = Math.hypot(xPct - ix, yPct - iy);
          el.style.opacity = dist < 24 ? '1' : '0.04';
        });
      }

      wall.addEventListener('mousemove', e => moveLight(e.clientX, e.clientY));
      wall.addEventListener('touchmove', e => {
        e.preventDefault();
        moveLight(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
    }

    function startOscilloscope() {
      const canvas = document.getElementById('scopeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let phase = 0;

      function drawWave(yFunc, color, lineWidth, dashed) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.setLineDash(dashed ? [6, 6] : []);
        for (let x = 0; x < canvas.width; x++) {
          const y = yFunc(x);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      function waveMath(type, x, freq, amp, ph) {
        const t = (x * freq * 0.0008) + ph;
        if (type === 'sine') return Math.sin(t) * amp;
        if (type === 'square') return (Math.sin(t) >= 0 ? 1 : -1) * amp;
        if (type === 'triangle') return (2 / Math.PI) * Math.asin(Math.sin(t)) * amp;
        return 0;
      }

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const midY = canvas.height / 2;

        // Onda objetivo guía (tenue al fondo: Triangular, 108 MHz, 75%)
        drawWave(x => midY + waveMath('triangle', x, 108, 75 * 0.7, phase), 'rgba(16, 185, 129, 0.35)', 2, true);

        // Onda en vivo del jugador
        const match = (state.freqWave === 'triangle' && state.freqMHz === 108 && state.freqMod === 75);
        const userColor = match ? '#10b981' : '#00f0ff';
        drawWave(x => midY + waveMath(state.freqWave, x, state.freqMHz, state.freqMod * 0.7, phase), userColor, 3, false);

        phase += 0.07;
        state.animFrame = requestAnimationFrame(loop);
      }
      loop();
    }

              <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(16,185,129,0.25)" />
              <!-- Barrido animado -->
              <line x1="100" y1="100" x2="100" y2="12" stroke="#10b981" stroke-width="3">
                <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite" />
              </line>
              <circle cx="65" cy="55" r="5" fill="#ff2a5f" />
              <circle cx="145" cy="75" r="6" fill="#10b981" />
              <circle cx="80" cy="145" r="5" fill="#00f0ff" />
            </svg>
            <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
              ${sats.map((s, i) => `
                <button class="tab-btn ${state.selectedSatP2 === i ? 'active' : ''}" onclick="selectSat(${i})">${s.name}</button>
              `).join('')}
            </div>
            <div style="background:#0d1524; border:1px solid var(--border); border-radius:8px; padding:12px;">
              <div>Onda: <strong style="color:var(--amber);">${cur.wave}</strong> | Frecuencia: <strong style="color:var(--cyan);">${cur.mhz}</strong> | Modulación: <strong style="color:var(--emerald);">${cur.mod}</strong></div>
            </div>
          </div>
        `;
      }
    }

    function pushThermalSym(id) {
      sfx('tap');
      if (state.thermalInputP2.length < 4 && !state.thermalInputP2.includes(id)) {
        state.thermalInputP2.push(id);
        render();
      }
    }

    function clearThermalSym() {
      sfx('tap');
      state.thermalInputP2 = [];
      render();
    }

    function selectSat(i) {
      sfx('tap');
      state.selectedSatP2 = i;
      render();
    }

    function verifyP2Stage2() {
      const target = ['SOL', 'RAYO', 'OJO', 'LUNA'];
      const fb = document.getElementById('fbMsg');
      if (state.thermalInputP2.length === 4 && state.thermalInputP2.every((v, i) => v === target[i])) {
        sfx('ok');
        fb.className = 'feedback-banner ok';
        fb.textContent = '¡Acceso biométrico concedido! Avanzando al Reactor...';
        setTimeout(() => { state.stage = 3; state.tab = 0; render(); }, 900);
      } else {
        sfx('err');
        fb.className = 'feedback-banner err';
        fb.textContent = 'Orden térmico incorrecto. Se ha reiniciado la secuencia.';
        state.thermalInputP2 = [];
        setTimeout(render, 700);
      }
    }

    // =====================================================
    // FASE 3 — P1: CORTE DE CABLES DEL REACTOR
    // =====================================================
    function renderP1Stage3(root, prog) {
      const wires = [
        { port: 'Puerto I',   name: 'Cable Rojo con Rayas Blancas', style: 'repeating-linear-gradient(45deg, #ff2a5f, #ff2a5f 10px, #ffffff 10px, #ffffff 20px)' },
        { port: 'Puerto II',  name: 'Cable Azul Sólido',            style: '#00f0ff' },
        { port: 'Puerto III', name: 'Cable Amarillo Industrial',    style: 'repeating-linear-gradient(90deg, #f59e0b, #f59e0b 12px, #1e293b 12px, #1e293b 18px)' },
        { port: 'Puerto IV',  name: 'Cable Verde Esmeralda',        style: '#10b981' },
        { port: 'Puerto V',   name: 'Cable Morado Neón',            style: '#a855f7' },
        { port: 'Puerto VI',  name: 'Cable Blanco Espiral',         style: 'repeating-linear-gradient(-45deg, #e2e8f0, #e2e8f0 8px, #64748b 8px, #64748b 16px)' }
      ];

      root.innerHTML = `
        ${prog}
        <h2>Fase 3: El Núcleo de Neurotoxina</h2>
        <p>¡Última etapa! Dile a tu pareja los datos del marcador del reactor que aparecen aquí abajo para que su simulador calcule <strong>cuáles 3 cables debes cortar y en qué orden exacto</strong>.</p>
        
        <div class="interactive-stage">
          <div style="background:#140c1c; border:1px solid var(--purple); border-radius:8px; padding:10px 14px; margin-bottom:14px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-family:monospace; font-size:0.86rem;">
            <span>⚡ VOLTAJE DEL NÚCLEO: <strong style="color:var(--amber);">480V</strong></span>
            <span>🔄 POLARIDAD: <strong style="color:var(--cyan);">INVERSA</strong></span>
            <span>🔑 PIN DE EMERGENCIA P2: <strong style="color:var(--emerald);">7390</strong></span>
          </div>

          <div class="wires-box">
            ${wires.map((w, idx) => {
              const isCut = state.cutWiresP1.includes(idx);
              return `
                <div class="wire-row" onclick="cutWireP1(${idx})">
                  <strong style="font-family:monospace; width:82px; font-size:0.85rem; color:var(--amber);">${w.port}</strong>
                  <div class="wire-cable ${isCut ? 'cut' : ''}" style="background:${w.style};"></div>
                </div>
              `;
            }).join('')}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <span style="font-family:monospace; font-size:0.85rem;">Orden cortado: <strong>${state.cutWiresP1.map(i => wires[i].port).join(' → ') || 'Ninguno'}</strong></span>
            <button class="btn-ghost" onclick="resetWiresP1()">Reconectar Cables</button>
          </div>
          <div id="fbMsg" class="feedback-banner"></div>
          <button class="btn-ghost" style="margin-top:8px;" onclick="toggleHint()">¿Atorados? Ver pista</button>
          <div id="hintBox" class="hint-drawer">Dile a tu pareja que active en su Simulador: "Voltaje 480V" y "Polaridad Inversa". Eso le revelará que debes cortar en este orden exacto: 1° Puerto III (Amarillo), 2° Puerto VI (Blanco), 3° Puerto I (Rojo con rayas).</div>
        </div>
      `;
    }

    function cutWireP1(idx) {
      if (state.cutWiresP1.includes(idx)) return;
      state.cutWiresP1.push(idx);

      // Meta exacta: [2, 5, 0] -> Puerto III, luego Puerto VI, luego Puerto I
      const target = [2, 5, 0];
      const currentStep = state.cutWiresP1.length - 1;

      if (state.cutWiresP1[currentStep] !== target[currentStep]) {
        sfx('err');
        render();
        const fb = document.getElementById('fbMsg');
        fb.className = 'feedback-banner err';
        fb.textContent = '💥 ¡Chispazo de seguridad! Orden o cable incorrecto. Reiniciando panel...';
        setTimeout(() => {
          state.cutWiresP1 = [];
          render();
        }, 1100);
        return;
      }

      sfx('valve');
      render();

      if (state.cutWiresP1.length === 3) {
        sfx('ok');
        const fb = document.getElementById('fbMsg');
        fb.className = 'feedback-banner ok';
        fb.textContent = '¡Cables neutralizados con éxito!';
        setTimeout(() => { state.stage = 4; render(); }, 900);
      }
    }

    function resetWiresP1() {
      sfx('tap');
      state.cutWiresP1 = [];
      render();
    }

    // =====================================================
    // FASE 3 — P2: SIMULADOR DE CIRCUITO DE LA BOMBA
    // =====================================================
    function renderP2Stage3(root, prog) {
      const s0 = state.simSwitchesP2[0]; // true = 480V
      const s1 = state.simSwitchesP2[1]; // true = Polaridad Inversa

      let instructionText = 'Ajusta los 2 interruptores de arriba según lo que vea tu pareja en el núcleo...';
      if (!s0 && !s1) instructionText = 'Configuración [240V / Directa]: Cortar II → IV → V';
      if (s0 && !s1)  instructionText = 'Configuración [480V / Directa]: Cortar V → II → III';
      if (!s0 && s1)  instructionText = 'Configuración [240V / Inversa]: Cortar IV → I → II';
      if (s0 && s1)   instructionText = '✅ Configuración [480V / Inversa]: Cortar en orden: 1° Puerto III (Amarillo) → 2° Puerto VI (Blanco) → 3° Puerto I (Rojo)';

      root.innerHTML = `
        ${prog}
        <h2>Fase 3: Simulador Lógico del Reactor</h2>
        <p>Configura el simulador con el Voltaje y la Polaridad que lee tu pareja en el reactor para decirle qué cables cortar, e ingresa el PIN de emergencia que aparece en su pantalla.</p>

        <div class="interactive-stage">
          <h3 style="color:var(--cyan); margin-bottom:10px;">1. Interruptores del Simulador de Corte:</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
            <button class="tab-btn ${s0 ? 'active' : ''}" onclick="toggleSimP2(0)">
              Voltaje: <strong>${s0 ? '480V (Alto)' : '240V (Estándar)'}</strong>
            </button>
            <button class="tab-btn ${s1 ? 'active' : ''}" onclick="toggleSimP2(1)">
              Polaridad: <strong>${s1 ? 'INVERSA' : 'DIRECTA'}</strong>
            </button>
          </div>

          <div style="background:#0d1524; border:1px solid var(--border); border-left:4px solid var(--amber); padding:14px; border-radius:8px; margin-bottom:18px; font-family:monospace; font-size:0.9rem;">
            ${instructionText}
          </div>

          <h3 style="color:var(--emerald); margin-bottom:8px;">2. Cierre de Válvula Digital:</h3>
          <p style="margin-bottom:8px;">Ingresa el <strong>PIN de Emergencia de 4 dígitos</strong> impreso en la placa del reactor de tu pareja:</p>
          <div style="display:flex; gap:8px;">
            <input type="text" id="finalPinP2" placeholder="PIN DE 4 DÍGITOS..." style="flex:1; background:#040811; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-family:monospace; font-size:1.05rem;" onkeydown="if(event.key==='Enter') verifyP2Stage3()" />
            <button class="btn" onclick="verifyP2Stage3()">Bloquear</button>
          </div>
          <div id="fbMsg" class="feedback-banner"></div>
        </div>
      `;
    }

    function toggleSimP2(idx) {
      sfx('tap');
      state.simSwitchesP2[idx] = !state.simSwitchesP2[idx];
      render();
    }

    function verifyP2Stage3() {
      const val = document.getElementById('finalPinP2').value.trim();
      const fb = document.getElementById('fbMsg');
      if (val === '7390') {
        sfx('ok');
        fb.className = 'feedback-banner ok';
        fb.textContent = '¡Reactor sellado digitalmente!';
        setTimeout(() => { state.stage = 4; render(); }, 900);
      } else {
        sfx('err');
        fb.className = 'feedback-banner err';
        fb.textContent = 'PIN incorrecto. Pídele al Agente de Infiltración el PIN verde de su pantalla.';
      }
    }

    // Iniciar app
    render();
  </script>
</body>
</html>
