<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expediente #8419: El Caso Blackwood</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #1f2630;
      --border: #30363d;
      --gold: #d29922;
      --gold-light: #e3b341;
      --crimson: #f85149;
      --cyan: #58a6ff;
      --green: #3fb950;
      --text: #e6edf3;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      background-image: radial-gradient(circle at 50% 0%, #1c2433 0%, #0d1117 70%);
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      margin-bottom: 24px;
    }

    header {
      background: #090c10;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      font-family: monospace;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(210, 153, 34, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(210, 153, 34, 0.4);
    }

    .role-badge-p1 {
      background: rgba(248, 81, 73, 0.15);
      color: #ff7b72;
      border-color: rgba(248, 81, 73, 0.4);
    }

    .role-badge-p2 {
      background: rgba(88, 166, 255, 0.15);
      color: var(--cyan);
      border-color: rgba(88, 166, 255, 0.4);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .content {
      padding: 24px 20px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.2rem;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    @media (max-width: 560px) {
      .role-grid {
        grid-template-columns: 1fr;
      }
    }

    .role-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      color: var(--text);
    }

    .role-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }

    .role-card.p1:hover {
      border-color: var(--crimson);
    }

    .role-card.p2:hover {
      border-color: var(--cyan);
    }

    .role-icon {
      font-size: 2rem;
      margin-bottom: 10px;
      display: block;
    }

    .role-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }

    .progress-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .progress-step {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
    }

    .progress-step.active {
      background: var(--gold);
    }

    .progress-step.done {
      background: var(--green);
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .evidence-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .evidence-btn:hover, .evidence-btn.selected {
      border-color: var(--gold-light);
      background: #262f3d;
    }

    .evidence-btn strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: var(--gold-light);
    }

    .evidence-btn span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .inspector-box {
      background: #0b0e14;
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    .inspector-box h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .mono-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-family: monospace;
      font-size: 0.88rem;
    }

    .mono-table th, .mono-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    .mono-table th {
      background: #161b22;
      color: var(--gold-light);
    }

    .unlock-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-top: 16px;
    }

    .unlock-panel label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.92rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"], select {
      flex: 1;
      background: #090c10;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1.05rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn {
      background: var(--gold);
      color: #090c10;
      font-weight: 700;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .feedback {
      margin-top: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 20px;
    }

    .feedback.error {
      color: var(--crimson);
    }

    .feedback.success {
      color: var(--green);
    }

    .hint-box {
      margin-top: 14px;
      padding: 12px;
      background: rgba(88, 166, 255, 0.08);
      border: 1px dashed rgba(88, 166, 255, 0.4);
      border-radius: 6px;
      font-size: 0.86rem;
      color: #a5d6ff;
      display: none;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .highlight {
      color: var(--gold-light);
      font-weight: 700;
      font-family: monospace;
    }
  </style>
</head>

      startTime: null,
      timerInterval: null

    // Sintetizador de audio ligero (sin archivos externos)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'click') {
        osc.frequency.setValueAtTime(520, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'success') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(660, now + 0.1);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

            promptLabel: "ID del sospechoso dueño de la huella (ej. XX00):",
            answer: "MS09",
            hint: "Pregúntale al Agente de Campo cuánto mide la huella en el barro del Invernadero y qué dibujo tiene la suela. Luego ingresa el ID del sospechoso (MS09).",
            clues: [
              {
                title: "1. Sensores Infrarrojos",
                sub: "Ruta detectada a las 11:35 PM",
                html: `<h3>Registro de Sensores de Movimiento</h3>
                       <p>Léale este reporte al Agente de Campo para que él arme el código de 4 puertas:</p>
                       <p><em>"1° El intruso ingresó por el <strong>Vestíbulo Principal</strong>.<br>
                       2° No pudo ir al Norte porque los láseres de la Galería de Arte estaban activos, así que caminó hacia el Este al <strong>Comedor</strong>.<br>
                       3° Intentó abrir la puerta Norte del Comedor pero estaba encadenada, por lo que siguió al Este hacia el <strong>Invernadero</strong>.<br>
                       4° Desde ahí activó el <strong>Pasadizo Secreto</strong> detrás de la estantería hacia el Estudio."</em></p>`
              },
              {
                title: "2. Registro de Sospechosos",
                sub: "Calzado registrado en peritaje",
                html: `<h3>Base de Datos Biométrica y Calzado</h3>
                       <table class="mono-table">
                         <tr><th>ID</th><th>Sospechoso</th><th>Talla</th><th>Tipo de Suela</th></tr>
                         <tr><td><strong>EV-04</strong></td><td>Elena Vance (Sobrina)</td><td>24.0 cm</td><td>Tacón de aguja</td></tr>
                         <tr><td><strong>MS-09</strong></td><td>Dr. Marcus Sterling (Socio)</td><td>27.5 cm</td><td>Patrón de Espiga</td></tr>
                         <tr><td><strong>JT-02</strong></td><td>Julian Thorne (Curador)</td><td>27.5 cm</td><td>Suela Lisa Italiana</td></tr>
                         <tr><td><strong>CM-07</strong></td><td>Clara Méndez (Ama de llaves)</td><td>25.0 cm</td><td>Goma Antideslizante</td></tr>
                       </table>`
              }
            ]
          },
          {
            title: "Fase 4: La Orden de Arresto",
            desc: "¡Expediente bancario desencriptado! Cruza tu información con el Agente de Campo y completen juntos la acusación formal.",
            isFinal: true,
            clues: [
              {
                title: "1. Rastreo Bancario",
                sub: "Transferencias de la Fundación",
                html: `<h3>Auditoría Forense Financiera</h3>
                       <p>• Se detectó un desvío ilegal por <strong>$2.4 millones de dólares</strong> desde la Fundación Vance hacia una cuenta en Islas Caimán a nombre del <strong>Dr. Marcus Sterling (MS-09)</strong>.</p>
                       <p>• Además, la clínica privada del Dr. Sterling registró la compra del compuesto <strong>K-714 (Kalmia Nocturna)</strong> hace 72 horas.</p>`
              }
            ]
          }
        ]
      }
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.startTime = Date.now();
      state.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        document.getElementById('timerDisplay').textContent = formatTime(elapsed);
      }, 1000);
    }

    function selectRole(role) {
      playSound('click');
      state.role = role;
      state.stage = 1;
      state.selectedClue = 0;
      startTimer();
      render();
    }

    function selectClue(idx) {
      playSound('click');
      state.selectedClue = idx;
      render();
    }

    function showHint() {
      playSound('click');
      const box = document.getElementById('hintBox');
      if (box) {
        if (box.style.display !== 'block') state.hintsUsed++;
        box.style.display = 'block';
      }
    }

    function checkStageCode() {
      const input = document.getElementById('codeInput');
      const feedback = document.getElementById('feedbackMsg');
      if (!input) return;

      const cleanInput = input.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      const currentStageObj = gameData[state.role].stages[state.stage];

      if (cleanInput === currentStageObj.answer) {
        playSound('success');
        feedback.className = 'feedback success';
        feedback.textContent = '¡Código verificado! Avanzando a la siguiente fase...';
        setTimeout(() => {
          state.stage++;
          state.selectedClue = 0;
          render();
        }, 900);
      } else {
        playSound('error');
        feedback.className = 'feedback error';
        feedback.textContent = 'Código incorrecto. Verifica los datos con tu pareja.';
      }
    }

    function submitFinalArrest() {
      const s1 = document.getElementById('finalSuspect').value;
      const s2 = document.getElementById('finalPoison').value;
      const s3 = document.getElementById('finalRoute').value;
      const s4 = document.getElementById('finalMotive').value;
      const feedback = document.getElementById('feedbackMsg');

      if (s1 === 'MS09' && s2 === 'K714' && s3 === '1849' && s4 === '24M') {
        playSound('success');
        clearInterval(state.timerInterval);
        state.stage = 5;
        render();
      } else {
        playSound('error');
        feedback.className = 'feedback error';
        feedback.textContent = 'Alguno de los datos del arresto no coincide con las pruebas. Revisen juntos.';
      }
    }

    function resetGame() {
      playSound('click');
      if (state.timerInterval) clearInterval(state.timerInterval);
      state = { role: null, stage: 0, selectedClue: 0, hintsUsed: 0, startTime: null, timerInterval: null };
      document.getElementById('timerDisplay').textContent = '00:00';
      render();
    }

    function render() {
      const container = document.getElementById('mainContent');
      const badge = document.getElementById('roleBadge');

      if (!state.role) {
        badge.className = 'badge';
        badge.textContent = 'EXPEDIENTE #8419';
        container.innerHTML = `
          <h1>El Caso de la Mansión Blackwood</h1>
          <p>A las 11:45 PM, el magnate Victor Vance fue hallado sin vida en su estudio cerrado. Para resolver el homicidio, uno de ustedes debe entrar a la escena del crimen y el otro operar el laboratorio forense desde su propia pantalla.</p>
          <div class="inspector-box">
            <h3>Instrucciones para jugar en pareja</h3>
            <p style="margin-bottom:0;">Cada jugador debe abrir este juego en su propio dispositivo y elegir un rol distinto. <strong>No miren la pantalla del otro:</strong> tendrán que describirse pistas, símbolos y reportes en voz alta para deducir los códigos de las 4 fases.</p>
          </div>
          <h2>Elige tu Rol en esta Pantalla:</h2>
          <div class="role-grid">
            <button class="role-card p1" onclick="selectRole('P1')">
              <span class="role-icon">🔦</span>
              <span class="role-title">Jugador 1: Agente de Campo</span>
              <p style="margin:0; font-size:0.85rem;">Inspecciona el cuerpo, las cerraduras, las reacciones químicas y los objetos físicos en el estudio.</p>
            </button>
            <button class="role-card p2" onclick="selectRole('P2')">
              <span class="role-icon">🔬</span>
              <span class="role-title">Jugador 2: Analista Forense</span>
              <p style="margin:0; font-size:0.85rem;">Opera las bases de datos de toxinas, sensores infrarrojos, casilleros y registros bancarios.</p>
            </button>
          </div>
        `;
        return;
      }

      const roleData = gameData[state.role];
      badge.className = `badge ${roleData.badgeClass}`;
      badge.textContent = roleData.roleName;

      if (state.stage === 5) {
        const totalTime = document.getElementById('timerDisplay').textContent;
        container.innerHTML = `
          <div style="text-align:center; padding: 16px 0;">
            <div style="font-size:3.2rem; margin-bottom:10px;">🚓</div>
            <h1>¡Caso Resuelto con Éxito!</h1>
            <p>El <strong>Dr. Marcus Sterling</strong> ha sido arrestado antes de abordar su vuelo privado. Intentó envenenar a Victor Vance con <strong>Kalmia Nocturna (K-714)</strong> entrando por el pasadizo del invernadero e inculpar a Elena Vance dejando su invitación Carmesí en el baño.</p>
            <div class="inspector-box" style="text-align:left;">
              <h3>Resumen del Operativo</h3>
              <p>• <strong>Rol jugado en este dispositivo:</strong> ${roleData.roleName}<br>
                 • <strong>Tiempo total de investigación:</strong> <span class="highlight">${totalTime}</span><br>
                 • <strong>Pistas de la central solicitadas:</strong> ${state.hintsUsed}<br>
                 • <strong>Rango de la pareja:</strong> ${state.hintsUsed === 0 ? 'Detectives Maestro (Sin pistas)' : 'Inspectores de Primera Línea'}</p>
            </div>
            <button class="btn" onclick="resetGame()">Jugar de Nuevo / Cambiar de Rol</button>
          </div>
        `;
        return;
      }

      const st = roleData.stages[state.stage];
      let progressHtml = `<div class="progress-bar">`;
      for (let i = 1; i <= 4; i++) {
        const cls = i < state.stage ? 'done' : (i === state.stage ? 'active' : '');
        progressHtml += `<div class="progress-step ${cls}"></div>`;
      }
      progressHtml += `</div>`;

      let cluesBtns = `<div class="evidence-grid">`;
      st.clues.forEach((c, idx) => {
        const sel = idx === state.selectedClue ? 'selected' : '';
        cluesBtns += `
          <button class="evidence-btn ${sel}" onclick="selectClue(${idx})">
            <strong>${c.title}</strong>
            <span>${c.sub}</span>
          </button>
        `;
      });
      cluesBtns += `</div>`;

      const currentClueHtml = st.clues[state.selectedClue].html;

      let bottomActionHtml = '';
      if (!st.isFinal) {
        bottomActionHtml = `
          <div class="unlock-panel">
            <label for="codeInput">${st.promptLabel}</label>
            <div class="input-row">
              <input type="text" id="codeInput" placeholder="INGRESA EL CÓDIGO..." autocomplete="off" onkeydown="if(event.key==='Enter') checkStageCode()" />
              <button class="btn" onclick="checkStageCode()">Desbloquear</button>
            </div>
            <div id="feedbackMsg" class="feedback"></div>
            <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
              <button class="btn btn-secondary" onclick="showHint()">¿Atorados? Pedir pista</button>
              <span style="font-size:0.78rem; color:var(--text-muted);">Fase ${state.stage} de 4</span>
            </div>
            <div id="hintBox" class="hint-box">${st.hint}</div>
          </div>
        `;
      } else {
        bottomActionHtml = `
          <div class="unlock-panel">
            <h2 style="margin-bottom:14px;">Emitir Orden de Arresto Conjunta</h2>
            <div class="form-group">
              <label>1. ¿Quién es el asesino de Victor Vance?</label>
              <select id="finalSuspect">
                <option value="">-- Selecciona al culpable --</option>
                <option value="EV04">Elena Vance (Sobrina)</option>
                <option value="MS09">Dr. Marcus Sterling (Socio médico)</option>
                <option value="JT02">Julian Thorne (Curador de arte)</option>
                <option value="CM07">Clara Méndez (Ama de llaves)</option>
              </select>
            </div>
            <div class="form-group">
              <label>2. ¿Qué compuesto se utilizó en la copa de vino?</label>
              <select id="finalPoison">
                <option value="">-- Selecciona la toxina --</option>
                <option value="C108">C-108 (Cianuro Potásico)</option>
                <option value="A309">A-309 (Acónito Imperial)</option>
                <option value="K714">K-714 (Kalmia Nocturna)</option>
                <option value="V501">V-501 (Atropina Destilada)</option>
              </select>
            </div>
            <div class="form-group">
              <label>3. ¿Qué secuencia de accesos usó para entrar al Estudio?</label>
              <select id="finalRoute">
                <option value="">-- Selecciona la ruta --</option>
                <option value="1527">1527 (Vestíbulo - Galería - Biblioteca - Estudio)</option>
                <option value="1827">1827 (Vestíbulo - Comedor - Biblioteca - Estudio)</option>
                <option value="1849">1849 (Vestíbulo - Comedor - Invernadero - Pasadizo)</option>
              </select>
            </div>
            <div class="form-group">
              <label>4. ¿Cuál fue el móvil del homicidio?</label>
              <select id="finalMotive">
                <option value="">-- Selecciona el móvil --</option>
                <option value="HERENCIA">Cobrar el seguro de vida y la herencia familiar</option>
                <option value="24M">Silenciar la denuncia por el desfalco de $2.4 millones</option>
                <option value="ARTE">Robar la colección privada de pinturas</option>
              </select>
            </div>
            <button class="btn" style="width:100%; margin-top:6px;" onclick="submitFinalArrest()">Firmar y Ejecutar Orden de Arresto</button>
            <div id="feedbackMsg" class="feedback"></div>
          </div>
        `;
      }

      container.innerHTML = `
        ${progressHtml}
        <h2>${st.title}</h2>
        <p>${st.desc}</p>
        ${cluesBtns}
        <div class="inspector-box">
          ${currentClueHtml}
        </div>
        ${bottomActionHtml}
      `;
    }

    // Inicializar vista
    render();
  </script>
</body>
</html>
